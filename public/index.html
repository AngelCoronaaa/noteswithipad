<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Notas">
  <meta name="theme-color" content="#e9eefb">
  <title>Notas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>

  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 16v6M8 3h8l-1 6 3 4H6l3-4z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M16 3.5l4.5 4.5L8 20.5 3 21l.5-5z"/><path d="M13.5 6l4.5 4.5"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M9 20l-5-5a1.8 1.8 0 010-2.5l9-9a1.8 1.8 0 012.5 0l5 5a1.8 1.8 0 010 2.5L12 20z"/><path d="M7 11.5l6 6M12 20h8"/></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></symbol>
      <symbol id="i-touch" viewBox="0 0 24 24"><path d="M9 11V5.5a1.6 1.6 0 013.2 0V10"/><path d="M12.2 9.5a1.6 1.6 0 013.2 0v1.3"/><path d="M15.4 10.8a1.6 1.6 0 013.1 0V15a6 6 0 01-6 6h-1a6 6 0 01-5-2.7l-2-3.1a1.5 1.5 0 012.4-1.7L9 15"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-page" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-scribble" viewBox="0 0 24 24"><path d="M4 16c3-6 5-9 7-9s0 8 2 8 3-5 7-7"/></symbol>
    </defs>
  </svg>

  <!-- Acceso -->
  <main id="auth" class="auth" hidden>
    <form id="auth-form" class="glass auth-card" autocomplete="on">
      <h1>Notas</h1>
      <p class="muted">Tus notas y dibujos, guardados en tu cuenta.</p>
      <div class="segmented" role="tablist">
        <button type="button" role="tab" data-mode="login" class="on">Entrar</button>
        <button type="button" role="tab" data-mode="register">Crear cuenta</button>
      </div>
      <label>
        <span>Usuario</span>
        <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label>
        <span>Contraseña</span>
        <input name="password" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <p id="auth-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="app" data-view="list" hidden>
    <aside class="sidebar glass">
      <header class="side-head">
        <h2>Notas</h2>
        <button id="new-note" class="icon-btn accent" title="Nueva nota" aria-label="Nueva nota"><svg><use href="#i-plus"/></svg></button>
      </header>
      <label class="search">
        <svg><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Buscar" autocomplete="off" spellcheck="false">
      </label>
      <ul id="note-list" class="note-list"></ul>
      <footer class="side-foot">
        <span id="whoami" class="muted"></span>
        <button id="logout" class="icon-btn" title="Cerrar sesión" aria-label="Cerrar sesión"><svg><use href="#i-logout"/></svg></button>
      </footer>
    </aside>

    <section class="editor">
      <div id="empty" class="empty">
        <svg><use href="#i-scribble"/></svg>
        <p>Selecciona o crea una nota</p>
      </div>

      <div id="note-view" class="note-view" hidden>
        <header class="note-bar">
          <button id="back" class="icon-btn glass-pill only-compact" aria-label="Notas"><svg><use href="#i-back"/></svg></button>
          <span id="status" class="status glass-pill" aria-live="polite"></span>
          <div class="spacer"></div>
          <button id="pin" class="icon-btn glass-pill" title="Fijar" aria-label="Fijar" aria-pressed="false"><svg><use href="#i-pin"/></svg></button>
          <button id="delete" class="icon-btn glass-pill" title="Eliminar" aria-label="Eliminar"><svg><use href="#i-trash"/></svg></button>
        </header>

        <div id="scroller" class="scroller">
          <div class="sheet-wrap">
            <div id="sheet" class="sheet">
              <input id="title" class="title" placeholder="Título" autocomplete="off" enterkeyhint="next">
              <textarea id="body" class="body" placeholder="Escribe o dibuja con el Apple Pencil…" spellcheck="true"></textarea>
              <canvas id="canvas" class="canvas"></canvas>
            </div>
          </div>
        </div>

        <div class="toolbar glass" role="toolbar" aria-label="Herramientas">
          <div class="group">
            <button class="tool" data-tool="text" title="Texto" aria-label="Texto"><svg><use href="#i-type"/></svg></button>
            <button class="tool" data-tool="pen" title="Lápiz" aria-label="Lápiz"><svg><use href="#i-pen"/></svg></button>
            <button class="tool" data-tool="eraser" title="Borrador" aria-label="Borrador"><svg><use href="#i-eraser"/></svg></button>
          </div>
          <div class="group draw-only">
            <button class="swatch" data-color="ink" aria-label="Tinta"></button>
            <button class="swatch" data-color="#0a84ff" aria-label="Azul"></button>
            <button class="swatch" data-color="#ff453a" aria-label="Rojo"></button>
            <button class="swatch" data-color="#30d158" aria-label="Verde"></button>
            <button class="swatch" data-color="#ff9f0a" aria-label="Naranja"></button>
            <button class="swatch" data-color="#bf5af2" aria-label="Morado"></button>
          </div>
          <div class="group draw-only">
            <button class="size" data-size="1.6" aria-label="Fino"><i></i></button>
            <button class="size" data-size="3.4" aria-label="Medio"><i></i></button>
            <button class="size" data-size="7" aria-label="Grueso"><i></i></button>
          </div>
          <div class="group">
            <button id="undo" class="tool draw-only" title="Deshacer" aria-label="Deshacer"><svg><use href="#i-undo"/></svg></button>
            <button id="redo" class="tool draw-only" title="Rehacer" aria-label="Rehacer"><svg><use href="#i-redo"/></svg></button>
            <button id="finger" class="tool draw-only" title="Dibujar también con el dedo" aria-label="Dibujar con el dedo" aria-pressed="false"><svg><use href="#i-touch"/></svg></button>
            <button id="more-page" class="tool draw-only" title="Agregar espacio" aria-label="Agregar espacio"><svg><use href="#i-page"/></svg></button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
