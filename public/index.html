<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notas">
  <meta name="application-name" content="Notas">
  <meta name="description" content="Notas y lienzos con Apple Pencil">
  <meta name="theme-color" id="theme-meta" content="#f1f2f5">
  <title>Notas</title>
  <link rel="manifest" href="manifest.webmanifest?v=__V__">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="theme.js?v=__V__"></script>
  <link rel="stylesheet" href="app.css?v=__V__">
</head>
<body>
  <svg class="sprite" width="0" height="0" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 16v6M8 3h8l-1 6 3 4H6l3-4z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M16 3.5l4.5 4.5L8 20.5 3 21l.5-5z"/><path d="M13.5 6l4.5 4.5"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M9 20l-5-5a1.8 1.8 0 010-2.5l9-9a1.8 1.8 0 012.5 0l5 5a1.8 1.8 0 010 2.5L12 20z"/><path d="M7 11.5l6 6M12 20h8"/></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></symbol>
      <symbol id="i-touch" viewBox="0 0 24 24"><path d="M9 11V5.5a1.6 1.6 0 013.2 0V10"/><path d="M12.2 9.5a1.6 1.6 0 013.2 0v1.3"/><path d="M15.4 10.8a1.6 1.6 0 013.1 0V15a6 6 0 01-6 6h-1a6 6 0 01-5-2.7l-2-3.1a1.5 1.5 0 012.4-1.7L9 15"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-page" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-scribble" viewBox="0 0 24 24"><path d="M4 16c3-6 5-9 7-9s0 8 2 8 3-5 7-7"/></symbol>
      <symbol id="i-canvas" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M7.5 15c1.5-4 3-6 4.5-6s.5 5 2 5 1.5-2 2.5-3"/></symbol>
      <symbol id="i-shapes" viewBox="0 0 24 24"><rect x="3" y="3.5" width="11" height="11" rx="2.5"/><circle cx="15.5" cy="15.5" r="5.5"/></symbol>
      <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.5 2.2 2.2 3.5 2.2s2.5-.7 3.5-2.2M9 9.5h.01M15 9.5h.01"/></symbol>
      <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5.5 3.5l13 6.5-5.5 1.8-1.8 5.7z"/><path d="M13 12l5 5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 017.5 4H15"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8 8 0 019.8 4 8 8 0 1020 14.2z"/></symbol>
      <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 010 17z" fill="currentColor"/></symbol>
      <symbol id="i-blank" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></symbol>
      <symbol id="i-lines" viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></symbol>
      <symbol id="i-dots" viewBox="0 0 24 24"><path stroke-width="3" d="M6.5 6.5h.01M12 6.5h.01M17.5 6.5h.01M6.5 12h.01M12 12h.01M17.5 12h.01M6.5 17.5h.01M12 17.5h.01M17.5 17.5h.01"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8 8.5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V15"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 15v3.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V15"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.5l4-4 4 4M7.5 10.5H6a1.5 1.5 0 00-1.5 1.5v7A1.5 1.5 0 006 20.5h12a1.5 1.5 0 001.5-1.5v-7a1.5 1.5 0 00-1.5-1.5h-1.5"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3.5H7A1.5 1.5 0 005.5 5v14A1.5 1.5 0 007 20.5h10a1.5 1.5 0 001.5-1.5V8z"/><path d="M14 3.5V8h4.5"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path stroke-width="2.6" d="M6 12h.01M12 12h.01M18 12h.01"/></symbol>
      <symbol id="i-layer-down" viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12.5l8 4 8-4M4 16.5l8 4 8-4"/></symbol>
    </defs>
  </svg>

  <!-- Acceso -->
  <main id="auth" class="auth" hidden>
    <form id="auth-form" class="glass auth-card" autocomplete="on">
      <h1>Notas</h1>
      <p class="muted">Tus notas y dibujos, guardados en tu cuenta.</p>
      <div class="segmented" role="tablist">
        <button type="button" role="tab" data-mode="login" class="on">Entrar</button>
        <button type="button" role="tab" data-mode="register">Crear cuenta</button>
      </div>
      <label>
        <span>Usuario</span>
        <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label>
        <span>Contraseña</span>
        <input name="password" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <p id="auth-error" class="error" role="alert"></p>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="app" data-view="hub" hidden>

    <!-- Inicio: todas las notas, lienzos y archivos -->
    <section id="hub" class="hub view">
      <header class="hub-head">
        <div class="hub-title">
          <h1>Notas</h1>
          <button id="net" class="net" type="button" hidden></button>
        </div>
        <div class="hub-tools">
          <div id="theme-picker" class="theme-picker" role="radiogroup" aria-label="Apariencia">
            <button data-theme-mode="auto" role="radio" title="Automático (sistema)" aria-label="Automático"><svg><use href="#i-auto"/></svg></button>
            <button data-theme-mode="light" role="radio" title="Claro" aria-label="Claro"><svg><use href="#i-sun"/></svg></button>
            <button data-theme-mode="dark" role="radio" title="Oscuro" aria-label="Oscuro"><svg><use href="#i-moon"/></svg></button>
          </div>
          <button id="user-btn" class="avatar" type="button" title="Cuenta" aria-label="Cuenta" aria-haspopup="menu"></button>
        </div>
      </header>

      <div class="hub-actions">
        <button class="action" data-new="note" type="button"><span class="action-ic"><svg><use href="#i-type"/></svg></span><span class="action-txt"><b>Nota</b><small>Texto y dibujo</small></span></button>
        <button class="action" data-new="canvas" type="button"><span class="action-ic"><svg><use href="#i-canvas"/></svg></span><span class="action-txt"><b>Lienzo</b><small>Hoja libre</small></span></button>
        <button class="action" id="import-btn" type="button"><span class="action-ic"><svg><use href="#i-upload"/></svg></span><span class="action-txt"><b>Importar</b><small>Archivos y copias</small></span></button>
      </div>

      <div class="hub-bar">
        <label class="search">
          <svg><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Buscar" autocomplete="off" spellcheck="false">
        </label>
        <div id="filters" class="chips" role="tablist" aria-label="Filtrar">
          <button data-filter="all" class="on" role="tab">Todo<span class="count"></span></button>
          <button data-filter="note" role="tab">Notas<span class="count"></span></button>
          <button data-filter="canvas" role="tab">Lienzos<span class="count"></span></button>
          <button data-filter="file" role="tab">Archivos<span class="count"></span></button>
        </div>
      </div>

      <div id="hub-body" class="hub-body"></div>
      <div id="drop-hint" class="drop-hint" hidden><div class="glass"><svg><use href="#i-upload"/></svg><span>Suelta para importar</span></div></div>
    </section>

    <!-- Editor de nota / lienzo -->
    <section id="note-view" class="note-view view" hidden>
      <header class="note-bar">
        <button id="back" class="icon-btn glass-pill" title="Inicio" aria-label="Volver al inicio"><svg><use href="#i-back"/></svg></button>
        <input id="ctitle" class="ctitle glass-pill" placeholder="Título del lienzo" autocomplete="off" hidden>
        <span id="status" class="status glass-pill" aria-live="polite"></span>
        <div class="spacer"></div>
        <div id="paper-picker" class="paper-picker glass-pill" role="radiogroup" aria-label="Papel" hidden>
          <button data-paper="blank" title="Hoja en blanco" aria-label="Hoja en blanco"><svg><use href="#i-blank"/></svg></button>
          <button data-paper="grid" title="Cuadrícula" aria-label="Cuadrícula"><svg><use href="#i-grid"/></svg></button>
          <button data-paper="lined" title="Rayada" aria-label="Rayada"><svg><use href="#i-lines"/></svg></button>
          <button data-paper="dots" title="Puntos" aria-label="Puntos"><svg><use href="#i-dots"/></svg></button>
        </div>
        <button id="export-btn" class="icon-btn glass-pill" title="Exportar" aria-label="Exportar" aria-haspopup="menu"><svg><use href="#i-share"/></svg></button>
        <button id="pin" class="icon-btn glass-pill" title="Fijar" aria-label="Fijar" aria-pressed="false"><svg><use href="#i-pin"/></svg></button>
        <button id="delete" class="icon-btn glass-pill" title="Eliminar" aria-label="Eliminar"><svg><use href="#i-trash"/></svg></button>
      </header>

      <div id="scroller" class="scroller">
        <div class="sheet-wrap">
          <div id="sheet" class="sheet" data-paper="blank">
            <input id="title" class="title" placeholder="Título" autocomplete="off" enterkeyhint="next">
            <textarea id="body" class="body" placeholder="Escribe o dibuja con el Apple Pencil…" spellcheck="true"></textarea>
            <canvas id="canvas" class="canvas"></canvas>
            <canvas id="live" class="canvas live"></canvas>
            <div id="sel-ui" class="sel-ui glass-pill" hidden>
              <button id="sel-back" title="Enviar al fondo" aria-label="Enviar al fondo"><svg><use href="#i-layer-down"/></svg></button>
              <button id="sel-copy" title="Duplicar" aria-label="Duplicar"><svg><use href="#i-copy"/></svg></button>
              <button id="sel-del" title="Eliminar" aria-label="Eliminar"><svg><use href="#i-trash"/></svg></button>
            </div>
          </div>
        </div>
      </div>

      <!-- Paneles de herramientas -->
      <div id="pop" class="pop glass" hidden>
        <div class="pop-sec" data-pop="pen">
          <div id="pen-list" class="pen-list"></div>
          <label class="slider"><span>Grosor</span><input id="size" type="range" min="0.4" max="4" step="0.1" value="1"></label>
        </div>
        <div class="pop-sec" data-pop="shape">
          <div id="shape-list" class="shape-list"></div>
          <label class="toggle"><input id="shape-fill" type="checkbox"><span>Relleno</span></label>
          <label class="slider"><span>Grosor</span><input id="size2" type="range" min="0.4" max="4" step="0.1" value="1"></label>
        </div>
        <div class="pop-sec" data-pop="color">
          <div id="palette" class="palette"></div>
          <label class="custom-color"><span>Personalizado</span><input id="custom-color" type="color" value="#0a84ff"></label>
        </div>
        <div class="pop-sec" data-pop="sticker">
          <div id="sticker-list" class="sticker-list"></div>
        </div>
      </div>

      <div class="toolbar glass" role="toolbar" aria-label="Herramientas">
        <div class="group">
          <button class="tool note-only" data-tool="text" title="Texto" aria-label="Texto"><svg><use href="#i-type"/></svg></button>
          <button class="tool" data-tool="pen" title="Lápiz" aria-label="Lápiz"><svg><use href="#i-pen"/></svg></button>
          <button class="tool" data-tool="eraser" title="Borrador" aria-label="Borrador"><svg><use href="#i-eraser"/></svg></button>
          <button class="tool" data-tool="shape" title="Formas" aria-label="Formas"><svg><use href="#i-shapes"/></svg></button>
          <button class="tool" data-tool="sticker" title="Stickers" aria-label="Stickers"><svg><use href="#i-smile"/></svg></button>
          <button class="tool" data-tool="select" title="Seleccionar y mover" aria-label="Seleccionar"><svg><use href="#i-cursor"/></svg></button>
          <button id="insert-image" class="tool" title="Insertar imagen" aria-label="Insertar imagen"><svg><use href="#i-image"/></svg></button>
        </div>
        <div class="group draw-only">
          <button id="color-btn" class="color-btn" title="Color" aria-label="Color"></button>
        </div>
        <div class="group">
          <button id="undo" class="tool draw-only" title="Deshacer" aria-label="Deshacer"><svg><use href="#i-undo"/></svg></button>
          <button id="redo" class="tool draw-only" title="Rehacer" aria-label="Rehacer"><svg><use href="#i-redo"/></svg></button>
          <button id="finger" class="tool draw-only" title="Dibujar también con el dedo" aria-label="Dibujar con el dedo" aria-pressed="false"><svg><use href="#i-touch"/></svg></button>
          <button id="more-page" class="tool draw-only" title="Agregar espacio" aria-label="Agregar espacio"><svg><use href="#i-page"/></svg></button>
        </div>
      </div>
    </section>

    <!-- Visor de archivos -->
    <section id="file-view" class="file-view view" hidden>
      <header class="note-bar">
        <button id="file-back" class="icon-btn glass-pill" title="Inicio" aria-label="Volver al inicio"><svg><use href="#i-back"/></svg></button>
        <span id="file-name" class="file-name glass-pill"></span>
        <div class="spacer"></div>
        <button id="file-annotate" class="pill-btn glass-pill" hidden><svg><use href="#i-pen"/></svg><span>Anotar</span></button>
        <button id="file-save" class="icon-btn glass-pill" title="Descargar / compartir" aria-label="Descargar"><svg><use href="#i-download"/></svg></button>
        <button id="file-delete" class="icon-btn glass-pill" title="Eliminar" aria-label="Eliminar"><svg><use href="#i-trash"/></svg></button>
      </header>
      <div id="file-body" class="file-body"></div>
    </section>
  </div>

  <!-- Menú flotante (tarjetas, exportar, cuenta) -->
  <div id="float-menu" class="menu glass float-menu" role="menu" hidden></div>
  <input id="import-input" type="file" multiple hidden>
  <input id="image-input" type="file" accept="image/*" hidden>

  <div id="toast" class="toast glass" role="status" hidden></div>

  <script src="app.js?v=__V__" type="module"></script>
</body>
</html>
